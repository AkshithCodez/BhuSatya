services:
  postgres:
    image: postgres:16
    container_name: bhusatya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bhusatya
      POSTGRES_USER: bhusatya
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhusatya -d bhusatya"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
